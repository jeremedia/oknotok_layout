openapi: 3.1.0
info:
  title: OKNOTOK Layout Designer API
  version: 0.1.0
servers:
  - url: https://oknotok.example.com/api
paths:
  /layouts:
    get:
      summary: List layouts
      description: Returns layouts filtered by owner, mode, or status with pagination.
      parameters:
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
        - name: mode
          in: query
          schema:
            type: string
            enum: [real_inventory, unlimited]
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, live, archived]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Layout collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutCollection'
    post:
      summary: Create layout
      description: Creates a new layout in the specified mode and reserves inventory when applicable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutCreateInput'
      responses:
        '201':
          description: Layout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
        '422':
          description: Validation errors (e.g., insufficient inventory)
  /layouts/{id}:
    get:
      summary: Retrieve layout
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      responses:
        '200':
          description: Layout details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
    patch:
      summary: Update layout components or metadata
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutUpdateInput'
      responses:
        '200':
          description: Updated layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
        '422':
          description: Validation errors
  /layouts/{id}/toggle_mode:
    post:
      summary: Toggle a layout between real inventory and unlimited mode
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeToggleInput'
      responses:
        '200':
          description: Updated layout with new mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
        '409':
          description: Conflicts detected when entering real inventory mode
  /layouts/{id}/duplicate:
    post:
      summary: Duplicate a layout into a selected mode
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutDuplicateInput'
      responses:
        '201':
          description: Duplicated layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
  /inventory/items:
    get:
      summary: List inventory items
      responses:
        '200':
          description: Inventory collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemCollection'
  /inventory/items/{id}:
    patch:
      summary: Update core inventory attributes
      parameters:
        - $ref: '#/components/parameters/InventoryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemUpdateInput'
      responses:
        '200':
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
  /inventory/items/{id}/adjustments:
    post:
      summary: Record inventory adjustment
      parameters:
        - $ref: '#/components/parameters/InventoryItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustmentInput'
      responses:
        '201':
          description: Adjustment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAdjustment'
  /admin/memberships/invitations:
    post:
      summary: Invite a new member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInput'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
  /admin/memberships/{id}:
    patch:
      summary: Update member status or role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateInput'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

components:
  parameters:
    LayoutId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InventoryItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LayoutCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Layout'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Layout:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          type: string
          enum: [real_inventory, unlimited]
        status:
          type: string
          enum: [draft, live, archived]
        owner_id:
          type: string
          format: uuid
        reserved_inventory_snapshot:
          type: object
          additionalProperties:
            type: integer
        components:
          type: array
          items:
            $ref: '#/components/schemas/LayoutComponent'
        updated_at:
          type: string
          format: date-time
    LayoutComponent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        component_type:
          type: string
          enum: [steel_bracket, beam_4x4, beam_6x6]
        variant:
          type: string
        quantity:
          type: integer
          minimum: 1
        position_data:
          type: object
        notes:
          type: string
    LayoutCreateInput:
      type: object
      required: [name, mode, components]
      properties:
        name:
          type: string
        mode:
          type: string
          enum: [real_inventory, unlimited]
        components:
          type: array
          items:
            $ref: '#/components/schemas/LayoutComponentInput'
        summary_note:
          type: string
    LayoutUpdateInput:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [draft, live, archived]
        summary_note:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/LayoutComponentInput'
    LayoutDuplicateInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [real_inventory, unlimited]
        name:
          type: string
        summary_note:
          type: string
    LayoutComponentInput:
      type: object
      required: [component_type, variant, quantity, position_data]
      properties:
        component_type:
          type: string
        variant:
          type: string
        quantity:
          type: integer
          minimum: 1
        position_data:
          type: object
        notes:
          type: string
    ModeToggleInput:
      type: object
      required: [target_mode]
      properties:
        target_mode:
          type: string
          enum: [real_inventory, unlimited]
        summary_note:
          type: string
    InventoryItemCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
    InventoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        sku:
          type: string
        on_hand:
          type: integer
        reserved:
          type: integer
        notes:
          type: string
        active:
          type: boolean
    InventoryItemUpdateInput:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        notes:
          type: string
        active:
          type: boolean
    InventoryAdjustmentInput:
      type: object
      required: [change, reason]
      properties:
        change:
          type: integer
        reason:
          type: string
    InventoryAdjustment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inventory_item_id:
          type: string
          format: uuid
        admin_id:
          type: string
          format: uuid
        change:
          type: integer
        reason:
          type: string
        applied_at:
          type: string
          format: date-time
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, member]
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        invited_by_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, expired]
    MemberUpdateInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, inactive]
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
